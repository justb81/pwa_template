name: Feature request
description: Suggest a new feature or an improvement.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem would this solve? What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you'd like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about, if any.
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraint check
      description: >
        This template is deliberately client-only and dependency-light (see §2 of
        docs/architecture.md). Please confirm your idea is compatible with those constraints.
      options:
        - label: This does not require a backend or a server-side runtime
          required: false
        - label: This does not add a third-party runtime dependency, external CDN or analytics
          required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: >
        This repository is the shared starting point for new apps, not an app itself.
      options:
        - label: This belongs in the template rather than in an app built on it
          required: false
