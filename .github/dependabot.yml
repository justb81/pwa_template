version: 2

updates:
  # pnpm dependencies. `package-ecosystem: npm` covers pnpm too — Dependabot reads
  # package.json and pnpm-lock.yaml under this ecosystem name.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Supply-chain cooldown: never adopt a version until it has been published
    # for at least 7 days. Guards against freshly-published compromised releases.
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      prod-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the native compiler rewrite) is not yet usable here:
      # typescript-eslint still caps its peer range at `typescript: >=4.8.4 <6.1.0`,
      # and eslint.config.js uses type-aware linting (`projectService: true`), so
      # there is no way to opt out. Drop this entry once typescript-eslint widens
      # the range, then do the TS 7 migration deliberately rather than via a bump
      # PR. Only majors are ignored — 6.x minor/patch updates still flow normally.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # GitHub Actions used by the CI workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
