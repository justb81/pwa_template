name: Deploy to GitHub Pages

# Called by release-please.yml once a release has been created, rather than
# triggered by `release: published` directly. A `release` event runs in tag
# context, and the `github-pages` environment's default-branch protection
# rejects a deployment from there; running as part of the push-to-main job graph
# keeps the deployment on `main` and removes the need for a PAT.
on:
  workflow_call: {}
  workflow_dispatch:

# Only one Pages deployment at a time, and never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Git hooks are pointless in CI and `prepare` would try to install them.
  HUSKY: '0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `enablement: true` turns Pages on via the workflow token, so a fresh fork
      # of this template needs no manual visit to Settings → Pages first.
      - id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # GitHub Pages serves project sites from a /<repo-name> subpath; vite.config.ts
      # reads BASE_PATH and hands it to SvelteKit's `paths.base`.
      - name: Build
        run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
